<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Stackly Electronic Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>
    <main class="login-page">
        <div class="login-container">
            <div class="login-illustration">
                <img src="assets/images/login-illustration.webp" alt="Register Illustration">
            </div>
            <div class="login-form-wrapper">
                <div class="login-heading">
                    <h1>Welcome Back</h1>
                    <p>LOGIN WITH EMAIL</p>
                </div>
                <form id="registerForm">
                    <div class="login-field">
                        <label for="registerName">Name <span>*</span></label>
                        <input type="text" id="registerName" class="form-control" placeholder="Enter your name"
                            autocomplete="name" required pattern="[A-Za-z ]+" minlength="2" maxlength="50"
                            title="Name can contain letters and spaces only.">
                    </div>
                    <div class="login-field">
                        <label for="registerEmail">Email <span>*</span></label>
                        <input type="email" id="registerEmail" class="form-control" placeholder="Enter your email"
                            autocomplete="email" required>
                    </div>
                    <div class="login-field">
                        <label for="registerPhone">Phone Number <span>*</span></label>
                        <input type="tel" id="registerPhone" class="form-control" placeholder="Enter your phone number"
                            autocomplete="tel" inputmode="numeric" required minlength="10" maxlength="10"
                            pattern="[0-9]{10}" title="Phone number must contain exactly 10 digits.">
                    </div>
                    <div class="login-field">
                        <label for="registerPassword">Password <span>*</span></label>
                        <div class="login-password-box">
                            <input type="password" id="registerPassword" class="form-control"
                                placeholder="Enter your password" autocomplete="new-password" required minlength="8"
                                pattern="(?=.*[0-9])(?=.*[A-Z])(?=.*[a-z])(?=.*[^A-Za-z0-9]).{8,}"
                                title="Password must contain at least 8 characters, one number, one uppercase letter, one lowercase letter and one special character.">
                            <button type="button" class="login-password-toggle" id="registerPasswordToggle"
                                aria-label="Show password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="login-field">
                        <label for="registerConfirmPassword">Confirm Password <span>*</span></label>
                        <div class="login-password-box">
                            <input type="password" id="registerConfirmPassword" class="form-control"
                                placeholder="Confirm your password" autocomplete="new-password" required>
                            <button type="button" class="login-password-toggle" id="registerConfirmPasswordToggle"
                                aria-label="Show password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="login-field">
                        <label>Select Role <span>*</span></label>
                        <div class="login-role-options">
                            <label class="login-role-option">
                                <input type="radio" name="registerRole" value="client" required>
                                <span>User</span>
                            </label>
                            <label class="login-role-option">
                                <input type="radio" name="registerRole" value="admin" required>
                                <span>Admin</span>
                            </label>
                        </div>
                    </div>
                    <div class="login-button-wrapper">
                        <button type="submit" class="login-submit-btn">Register</button>
                    </div>
                    <div class="login-divider">
                        <span></span>
                        <small>OR</small>
                        <span></span>
                    </div>
                    <div class="login-social-buttons">
                        <a href="404.html"><button type="button" class="login-social-btn"
                                aria-label="Register with Google"><i class="bi bi-google"></i></button></a>
                        <a href="404.html"><button type="button" class="login-social-btn"
                                aria-label="Register with Facebook"><i class="bi bi-facebook"></i></button></a>
                        <a href="404.html"><button type="button" class="login-social-btn"
                                aria-label="Register with Apple"><i class="bi bi-apple"></i></button></a>
                    </div>
                    <p class="login-register-text">Already have an account? <a href="login.html">Login Now</a></p>
                    <p class="login-register-text"><i class="bi bi-arrow-left"></i>
                        <a href="index.html">Go Home</a>
                    </p>
                </form>
            </div>
        </div>
    </main>
    <script src="assets/js/auth.js"></script>
</body>

</html>
