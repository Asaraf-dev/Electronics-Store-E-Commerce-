<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Stackly Electronic Store</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Login CSS -->
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <!-- Left Illustration -->
            <div class="login-illustration">
                <img src="assets/images/login-illustration.webp" alt="Login Illustration">
            </div>

            <!-- Login Form -->
            <div class="login-form-wrapper">

                <div class="login-heading">
                    <h1>Welcome Back</h1>
                    <p>LOGIN TO CONTINUE</p>
                </div>

                <form id="loginForm">

                    <!-- Email -->
                    <div class="login-field">
                        <label for="loginEmail">
                            Email Address <span>*</span>
                        </label>

                        <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email"
                            autocomplete="email" required>
                    </div>

                    <!-- Password -->
                    <div class="login-field">
                        <label for="loginPassword">
                            Password <span>*</span>
                        </label>

                        <div class="login-password-box">

                            <input type="password" id="loginPassword" class="form-control"
                                placeholder="Enter your password" autocomplete="current-password" required>

                            <button type="button" class="login-password-toggle" id="passwordToggle"
                                aria-label="Show password">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                        <div class="login-forgot-wrapper">
                            <a href="forgot-password.html">
                                Forgot Password?
                            </a>
                        </div>
                    </div>


                    <!-- Role Selection -->
                    <div class="login-field">

                        <label>
                            Select Role <span>*</span>
                        </label>

                        <div class="login-role-options">

                            <label class="login-role-option">
                                <input type="radio" name="loginRole" value="client" required>
                                <span>User</span>
                            </label>

                            <label class="login-role-option">
                                <input type="radio" name="loginRole" value="admin" required>
                                <span>Admin</span>
                            </label>

                        </div>

                    </div>

                    <!-- Login Button -->
                    <div class="login-button-wrapper">

                        <button type="submit" class="login-submit-btn">

                            Login

                        </button>

                    </div>

                    <!-- OR -->
                    <div class="login-divider">
                        <span></span>
                        <small>OR</small>
                        <span></span>
                    </div>

                    <!-- Social Buttons -->
                    <div class="login-social-buttons">

                        <a href="404.html"><button type="button" class="login-social-btn"
                                aria-label="Login with Google">

                                <i class="bi bi-google"></i>

                            </button></a>

                        <a href="404.html"><button type="button" class="login-social-btn"
                                aria-label="Login with Facebook">

                                <i class="bi bi-facebook"></i>

                            </button></a>

                        <a href="404.html"><button type="button" class="login-social-btn" aria-label="Login with Apple">

                                <i class="bi bi-apple"></i>

                            </button></a>

                    </div>

                    <!-- Register -->
                    <p class="login-register-text">
                        Don't have an account?
                        <a href="register.html">Register Now</a>
                    </p>
                    <p class="login-register-text"><i class="bi bi-arrow-left"></i>
                        <a href="index.html">Go Home</a>
                    </p>

                </form>

            </div>

        </div>

    </main>

    <script src="assets/js/auth.js"></script>

</body>

</html>
